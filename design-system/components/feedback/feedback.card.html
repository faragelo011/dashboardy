<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--surface-canvas); padding: 20px; }
  .wrap { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .eyebrow { font-size: var(--text-micro); font-weight: 600; letter-spacing: var(--tracking-kicker);
    text-transform: uppercase; color: var(--text-muted); margin: 0 0 6px; }
  .stack { display: flex; flex-direction: column; gap: 8px; max-width: 560px; }
  .cols { display:grid; grid-template-columns: 1fr 1fr; gap: 14px; }
</style>
</head>
<body>
<div id="root" class="wrap"></div>
<script type="text/babel" data-presets="react">
  const NS = window.DashboardyDesignSystem_787e56;
  const { Badge, Alert, EmptyState, Skeleton, Button } = NS;

  function Demo() {
    return (
      <React.Fragment>
        <div>
          <p className="eyebrow">Status badges</p>
          <div className="row">
            <Badge tone="ok">active</Badge>
            <Badge tone="warn">pending test</Badge>
            <Badge tone="danger">test failed</Badge>
            <Badge tone="idle">not configured</Badge>
            <Badge tone="info">override</Badge>
            <Badge tone="neutral" dot={false}>Admin</Badge>
          </div>
        </div>
        <div>
          <p className="eyebrow">Alerts</p>
          <div className="stack">
            <Alert tone="danger" title="Execution failed">timeout: warehouse did not respond within 30s</Alert>
            <Alert tone="info" title="Security">Credentials are write-only and never returned after saving.</Alert>
            <Alert tone="warn" title="Queued">Execution is queued under load; results will appear shortly.</Alert>
          </div>
        </div>
        <div className="cols">
          <div>
            <p className="eyebrow">Empty state</p>
            <EmptyState title="No grants" description="No external distributions have been authorized yet." />
          </div>
          <div>
            <p className="eyebrow">Loading (skeleton)</p>
            <div style={{display:"flex",flexDirection:"column",gap:"10px",padding:"16px",
              border:"1px solid var(--border-subtle)",borderRadius:"var(--radius-md)",background:"var(--surface-card)"}}>
              <Skeleton width={120} height={28} />
              <Skeleton width="80%" height={14} />
              <Skeleton width="65%" height={14} />
              <Skeleton width="90%" height={14} />
            </div>
          </div>
        </div>
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body>
</html>

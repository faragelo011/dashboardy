<!-- @dsCard group="Components" viewport="700x520" name="Forms" subtitle="Buttons, inputs, select, checkbox, field rows" -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--surface-canvas); padding: 20px; }
  .wrap { display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .eyebrow { font-size: var(--text-micro); font-weight: 600; letter-spacing: var(--tracking-kicker);
    text-transform: uppercase; color: var(--text-muted); margin: 0 0 2px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 520px; }
</style>
</head>
<body>
<div id="root" class="wrap"></div>
<script type="text/babel" data-presets="react">
  const NS = window.DashboardyDesignSystem_787e56;
  const { Button, IconButton, Input, Textarea, Select, Checkbox, Field } = NS;

  const Plus = () => (
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14M5 12h14"/></svg>
  );
  const Moon = () => (
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  );

  function Demo() {
    return (
      <React.Fragment>
        <div>
          <p className="eyebrow">Buttons — variants</p>
          <div className="row">
            <Button variant="primary" leftIcon={<Plus/>}>New dashboard</Button>
            <Button variant="secondary">Back to list</Button>
            <Button variant="ghost">Cancel</Button>
            <Button variant="danger">Rotate credentials</Button>
          </div>
        </div>
        <div>
          <p className="eyebrow">Sizes &amp; states</p>
          <div className="row">
            <Button variant="primary" size="sm">Small</Button>
            <Button variant="primary">Medium</Button>
            <Button variant="primary" size="lg">Large</Button>
            <Button variant="primary" disabled>Disabled</Button>
            <IconButton aria-label="Toggle theme"><Moon/></IconButton>
            <IconButton variant="ghost" aria-label="Add"><Plus/></IconButton>
          </div>
        </div>
        <div>
          <p className="eyebrow">Fields</p>
          <div className="grid2">
            <Field label="Display name"><Input placeholder="Primary Snowflake" defaultValue="Primary Snowflake" /></Field>
            <Field label="Warehouse"><Input placeholder="COMPUTE_WH" /></Field>
            <Field label="Widget type"><Select options={["KPI","Bar","Line","Table"]} /></Field>
            <Field label="Asset ID" hint="(uuid)"><Input mono size="sm" placeholder="00000000-0000-4000…" /></Field>
            <div style={{gridColumn:"1 / -1"}}>
              <Field label="Description"><Textarea rows={2} placeholder="What this connection is for…" /></Field>
            </div>
            <Field label="Schema" optional error="Duplicate name in workspace"><Input invalid defaultValue="PUBLIC" /></Field>
            <div style={{alignSelf:"end", paddingBottom:"6px"}}>
              <Checkbox defaultChecked label="Authorize download" />
            </div>
          </div>
        </div>
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboardy — UI kit</title>
<link rel="stylesheet" href="../../styles.css" />
<script>
  // No-FOUC theme bootstrap (mirrors the real app).
  (function () {
    try {
      var k = "dashboardy-theme";
      var s = localStorage.getItem(k);
      var m = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = s === "dark" || s === "light" ? s : (m ? "dark" : "light");
    } catch (e) { document.documentElement.dataset.theme = "light"; }
  })();
</script>
<style>
  html, body { margin: 0; min-height: 100%; background: var(--surface-canvas); }
  #root { min-height: 100vh; }
  @media (max-width: 860px) {
    .kit-cols { grid-template-columns: 1fr !important; }
    .kit-wgrid { grid-template-columns: repeat(2, 1fr) !important; }
    .kit-wgrid > div[style*="span 4"], .kit-wgrid > div[style*="span 2"] { grid-column: span 2 !important; }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>

<!-- @dsCard group="Spacing" viewport="700x200" name="Spacing scale" subtitle="4px base grid · dense by default" -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--surface-canvas);padding:18px;font-family:var(--font-body);}
  .row{display:flex;align-items:center;gap:12px;margin-bottom:7px;}
  .bar{height:14px;background:var(--color-accent);border-radius:2px;}
  .nm{width:64px;font-family:var(--font-mono);font-size:11px;color:var(--text-primary);}
  .px{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);}
</style></head>
<body>
  <div class="row"><span class="nm">space-1</span><div class="bar" style="width:4px"></div><span class="px">4px</span></div>
  <div class="row"><span class="nm">space-2</span><div class="bar" style="width:8px"></div><span class="px">8px</span></div>
  <div class="row"><span class="nm">space-3</span><div class="bar" style="width:12px"></div><span class="px">12px</span></div>
  <div class="row"><span class="nm">space-4</span><div class="bar" style="width:16px"></div><span class="px">16px · card padding</span></div>
  <div class="row"><span class="nm">space-6</span><div class="bar" style="width:24px"></div><span class="px">24px · card p-6</span></div>
  <div class="row"><span class="nm">space-8</span><div class="bar" style="width:32px"></div><span class="px">32px · section gap</span></div>
  <div class="row"><span class="nm">space-10</span><div class="bar" style="width:40px"></div><span class="px">40px</span></div>
  <div class="row"><span class="nm">space-16</span><div class="bar" style="width:64px"></div><span class="px">64px</span></div>
</body></html>

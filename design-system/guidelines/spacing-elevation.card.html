<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation — Soft" subtitle="Rounded surfaces + soft cool shadows; more lift = more float" -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--surface-canvas);padding:22px;font-family:var(--font-body);}
  .grid{display:flex;gap:22px;align-items:center;}
  .box{width:120px;height:64px;background:var(--surface-base);border-radius:var(--radius-md);
    border:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:center;
    font-size:11px;color:var(--text-muted);}
  .card{box-shadow:var(--shadow-card);}
  .md{box-shadow:var(--shadow-md);}
  .lg{box-shadow:var(--shadow-lg);}
  .focus{border:1px solid var(--color-accent);box-shadow:var(--shadow-focus);}
  .nm{margin-top:9px;font-size:10px;font-family:var(--font-mono);color:var(--text-faint);text-align:center;}
</style></head>
<body>
  <div class="grid">
    <div><div class="box card">card</div><div class="nm">shadow-card</div></div>
    <div><div class="box md">raised</div><div class="nm">shadow-md</div></div>
    <div><div class="box lg">popover</div><div class="nm">shadow-lg</div></div>
    <div><div class="box focus">focus</div><div class="nm">shadow-focus</div></div>
  </div>
</body></html>

<!-- @dsCard group="Colors" viewport="700x140" name="Data viz — Series" subtitle="Ordered categorical palette · pair with labels, never hue alone" -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--surface-canvas);padding:16px;font-family:var(--font-body);}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;}
  .sw{height:48px;border-radius:var(--radius-sm);}
  .nm{margin-top:7px;font-size:10px;font-weight:600;color:var(--text-primary);}
  .vl{margin-top:1px;font-family:var(--font-mono);font-size:9px;color:var(--text-faint);}
</style></head>
<body>
  <div class="grid">
    <div><div class="sw" style="background:oklch(var(--viz-1))"></div><div class="nm">viz-1</div><div class="vl">indigo</div></div>
    <div><div class="sw" style="background:oklch(var(--viz-2))"></div><div class="nm">viz-2</div><div class="vl">violet</div></div>
    <div><div class="sw" style="background:oklch(var(--viz-3))"></div><div class="nm">viz-3</div><div class="vl">sky</div></div>
    <div><div class="sw" style="background:oklch(var(--viz-4))"></div><div class="nm">viz-4</div><div class="vl">amber</div></div>
    <div><div class="sw" style="background:oklch(var(--viz-5))"></div><div class="nm">viz-5</div><div class="vl">emerald</div></div>
    <div><div class="sw" style="background:oklch(var(--viz-6))"></div><div class="nm">viz-6</div><div class="vl">rose</div></div>
  </div>
</body></html>

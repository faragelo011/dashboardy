<!-- @dsCard group="Brand" viewport="700x170" name="Wordmark" subtitle="Dashboardy is set in type — there is no logo mark" -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--surface-canvas);padding:22px;font-family:var(--font-body);}
  .lockup{font-family:var(--font-display);font-weight:600;letter-spacing:-0.03em;color:var(--text-strong);}
  .row{display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
  .darkchip{background:oklch(16% .012 258);border-radius:var(--radius-md);padding:14px 18px;}
  .darkchip .lockup{color:oklch(97% .003 250);}
  .accent{color:var(--color-accent);}
  .note{margin-top:16px;font-size:12px;color:var(--text-muted);max-width:60ch;}
</style></head>
<body>
  <div class="row">
    <span class="lockup" style="font-size:30px">Dashboardy</span>
    <span class="lockup" style="font-size:18px">Dashboardy</span>
    <span class="lockup accent" style="font-size:18px">Dashboardy</span>
    <span class="darkchip"><span class="lockup" style="font-size:18px">Dashboardy</span></span>
  </div>
  <p class="note">The product ships no logo mark. The name is rendered in Space Grotesk SemiBold, tight tracking (−0.03em), in <code>ink-strong</code> — with an accent hover in the nav. Do not invent a symbol.</p>
</body></html>

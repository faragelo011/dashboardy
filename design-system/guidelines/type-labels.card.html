<!-- @dsCard group="Type" viewport="700x160" name="Kickers & labels" subtitle="Uppercase micro-type that sets the dense rhythm" -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--surface-canvas);padding:20px;font-family:var(--font-body);}
  .stack{display:flex;flex-direction:column;gap:14px;}
  .item{display:flex;align-items:center;gap:14px;}
  .meta{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);}
  .kicker{font-size:11px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:var(--text-muted);}
  .label{font-size:12px;font-weight:500;letter-spacing:0.01em;color:var(--text-primary);}
  .thead{font-size:11px;font-weight:600;letter-spacing:0.01em;text-transform:uppercase;color:var(--text-faint);}
</style></head>
<body>
  <div class="stack">
    <div class="item"><span class="kicker">Administrative settings</span><span class="meta">kicker · 11 / 600 · .16em</span></div>
    <div class="item"><span class="label">Warehouse</span><span class="meta">label · 12 / 500</span></div>
    <div class="item"><span class="thead">Identity&nbsp;&nbsp;Role&nbsp;&nbsp;Status</span><span class="meta">table head · 11 / 600 uppercase</span></div>
  </div>
</body></html>

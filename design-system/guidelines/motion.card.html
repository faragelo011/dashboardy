<!-- @dsCard group="Motion" viewport="700x170" name="Motion & easing" subtitle="Quiet, functional · collapses under reduced-motion" -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--surface-canvas);padding:20px;font-family:var(--font-body);}
  .grid{display:flex;gap:30px;align-items:flex-start;}
  .col .meta{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);margin-bottom:8px;}
  .chip{display:inline-block;font-family:var(--font-mono);font-size:11px;color:var(--text-primary);
    background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);
    padding:4px 8px;margin:0 6px 6px 0;}
  .pulse{width:150px;height:12px;border-radius:var(--radius-sm);background:var(--surface-raised);
    animation:dby-pulse 1.5s var(--ease-in-out) infinite;margin-bottom:8px;}
  .pulse.b{width:110px;} .pulse.c{width:130px;}
  .dot{width:40px;height:40px;border-radius:var(--radius-md);background:var(--color-accent);
    animation:dby-fade-in-up 0.8s var(--ease-out) infinite alternate;}
</style></head>
<body>
  <div class="grid">
    <div class="col">
      <div class="meta">durations</div>
      <span class="chip">fast 140ms</span><span class="chip">base 220ms</span><span class="chip">entrance 700ms</span>
      <div class="meta" style="margin-top:10px">easing</div>
      <span class="chip">standard · controls</span><span class="chip">cubic(.16,1,.3,1) · entrance</span>
    </div>
    <div class="col">
      <div class="meta">loading — pulse (reduced-motion safe)</div>
      <div class="pulse"></div><div class="pulse b"></div><div class="pulse c"></div>
    </div>
    <div class="col">
      <div class="meta">fade-in-up</div>
      <div class="dot"></div>
    </div>
  </div>
</body></html>
